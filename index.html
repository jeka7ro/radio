<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- MANDATORY: Declare support for both light and dark themes -->
    <meta name="color-scheme" content="light dark" />
    <script>
      // Polyfills for Smart TV WebViews (LG webOS / Samsung Tizen / Android TV / MSX)
      if (typeof window.globalThis === 'undefined') {
        window.globalThis = window;
      }
      if (typeof window.queueMicrotask !== 'function') {
        window.queueMicrotask = function (cb) {
          Promise.resolve().then(cb).catch(function (e) {
            setTimeout(function () { throw e; }, 0);
          });
        };
      }
      if (typeof Promise !== 'undefined' && typeof Promise.allSettled !== 'function') {
        Promise.allSettled = function (promises) {
          var arr = Array.prototype.slice.call(promises || []);
          return Promise.all(
            arr.map(function (p) {
              return Promise.resolve(p).then(
                function (value) { return { status: 'fulfilled', value: value }; },
                function (reason) { return { status: 'rejected', reason: reason }; }
              );
            })
          );
        };
      }
      if (!Array.prototype.flat) {
        Array.prototype.flat = function (depth) {
          var d = depth === undefined ? 1 : Number(depth);
          var result = [];
          (function flatten(arr, currentDepth) {
            for (var i = 0; i < arr.length; i++) {
              if (Array.isArray(arr[i]) && currentDepth > 0) {
                flatten(arr[i], currentDepth - 1);
              } else {
                result.push(arr[i]);
              }
            }
          })(this, d);
          return result;
        };
      }
      if (!Array.prototype.flatMap) {
        Array.prototype.flatMap = function (fn, thisArg) {
          return this.map(fn, thisArg).flat(1);
        };
      }
      if (!Object.fromEntries) {
        Object.fromEntries = function (entries) {
          var obj = {};
          var arr = Array.from ? Array.from(entries) : entries;
          for (var i = 0; i < arr.length; i++) {
            if (arr[i]) obj[arr[i][0]] = arr[i][1];
          }
          return obj;
        };
      }
      if (!String.prototype.replaceAll) {
        String.prototype.replaceAll = function (search, replacement) {
          if (search instanceof RegExp) return this.replace(search, replacement);
          return this.split(String(search)).join(String(replacement));
        };
      }
      if (!Array.prototype.at) {
        Array.prototype.at = function (n) {
          n = Math.trunc(n) || 0;
          if (n < 0) n += this.length;
          if (n < 0 || n >= this.length) return undefined;
          return this[n];
        };
      }
      if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) {
          this.rect(x, y, w, h);
        };
      }

      try {
        var storedScheme = null;
        try { storedScheme = localStorage.getItem('color-scheme'); } catch (e) {}
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta && (storedScheme === 'light' || storedScheme === 'dark')) {
          meta.content = storedScheme;
        }
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isTvRoute = window.location.pathname.toLowerCase().indexOf('/tv') === 0 || window.location.search.indexOf('tv') !== -1 || (window.self !== window.top);
        var isDark = isTvRoute || storedScheme === 'dark' || (!storedScheme && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        if (isTvRoute) {
          document.documentElement.classList.add('smart-tv-mode');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
      try {
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) {
              if (keys[i] === 'aether-radio-v1' || keys[i] === 'aether-radio-v2') {
                caches.delete(keys[i]);
              }
            }
          });
        }
      } catch (e) {}

      window.addEventListener('error', function (ev) {
        try {
          var msg = (ev && ev.message ? ev.message : 'Script error') + ' (' + (ev && ev.filename ? ev.filename : '') + ':' + (ev && ev.lineno ? ev.lineno : '') + ')';
          fetch('/api/tv-log?err=' + encodeURIComponent(msg) + '&ua=' + encodeURIComponent(navigator.userAgent)).catch(function(){});
          var bootEl = document.getElementById('tv-boot-status');
          if (bootEl) {
            bootEl.innerHTML = 'Eroare pornire TV: ' + msg;
            bootEl.style.color = '#f87171';
          }
        } catch (e) {}
      });
    </script>
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Filmio — Filme 4K/1080p, Seriale, TV Online IPTV și Radio Live pe Smart TV și Web."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Filmio" />
    <meta name="application-name" content="Filmio" />
    <meta property="og:title" content="Filmio" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Filmio</title>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-zinc-950 dark:text-zinc-100 antialiased selection:bg-brand-600 selection:text-white" style="background-color:#09090b;color:#f4f4f5;">
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#070e1a;color:#f4f4f5;font-family:sans-serif;text-align:center;padding:24px;">
        <img src="/icons/icon-192.svg" alt="Filmio" style="width:76px;height:76px;margin-bottom:16px;filter:drop-shadow(0 0 24px rgba(56, 189, 248, 0.45));" />
        <div style="font-size:32px;font-weight:800;letter-spacing:0.4px;margin-bottom:8px;color:#fff;">Film<span style="color:#38bdf8;">io</span></div>
        <div id="tv-boot-status" style="font-size:15px;color:#60a5fa;">Se încarcă interfața Filmio TV...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
