[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/tv-proxy"
  to = "/.netlify/functions/tv-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/api/tv-epg"
  to = "/.netlify/functions/tv-epg"
  status = 200
  force = true

[[redirects]]
  from = "/api/tv-epg-archive"
  to = "/.netlify/functions/tv-epg-archive"
  status = 200
  force = true

[[redirects]]
  from = "/api/radio-meta"
  to = "/.netlify/functions/radio-meta"
  status = 200
  force = true

[[redirects]]
  from = "/api/vod-stream"
  to = "/.netlify/functions/vod-stream"
  status = 200
  force = true

[[redirects]]
  from = "/tv/msx/*"
  to = "/msx/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tv/start.json"
  to = "/start.json"
  status = 200
  force = true

[[headers]]
  for = "/msx/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "*"
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/start.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "*"
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/m.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "*"
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


