<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    @keyframes scOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes scPulse {
      0%, 100% { opacity: 0.45; transform: scale(0.96); }
      50% { opacity: 0.95; transform: scale(1.04); }
    }
    .sc-ring {
      transform-origin: 32px 32px;
      animation: scOrbit 8s linear infinite;
    }
    .sc-glow {
      transform-origin: 32px 32px;
      animation: scPulse 3.2s ease-in-out infinite;
    }
  </style>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.7"/>
  <circle class="sc-glow" cx="32" cy="32" r="22" fill="url(#auraGrad)"/>
  <circle cx="32" cy="32" r="20" stroke="#2563eb" stroke-opacity="0.22" stroke-width="2"/>
  <circle class="sc-ring" cx="32" cy="32" r="20" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="42 84"/>
  <circle cx="32" cy="32" r="14" fill="#070B09" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.2"/>
  <path d="M27.2 22.8C27.2 21.6 28.5 20.9 29.5 21.5L42.2 29.7C43.1 30.3 43.1 31.7 42.2 32.3L29.5 40.5C28.5 41.1 27.2 40.4 27.2 39.2V22.8Z" fill="url(#playGrad)"/>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050807"/>
      <stop offset="0.55" stop-color="#0B1510"/>
      <stop offset="1" stop-color="#07120C"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#2563eb" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="auraGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(32 32) rotate(90) scale(22)">
      <stop stop-color="#2563eb" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
      <stop offset="0.6" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="26" y1="21" x2="43" y2="41" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bfdbfe"/>
      <stop offset="0.45" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
</svg>
