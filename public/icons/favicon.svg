<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <style>
    @keyframes filmioOrbit512 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes filmioPulse512 {
      0%, 100% { opacity: 0.5; transform: scale(0.97); }
      50% { opacity: 0.95; transform: scale(1.03); }
    }
    .sc-ring {
      transform-origin: 256px 256px;
      animation: filmioOrbit512 9s linear infinite;
    }
    .sc-glow {
      transform-origin: 256px 256px;
      animation: filmioPulse512 3.2s ease-in-out infinite;
    }
  </style>

  <!-- Deep Cinema Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bg512)"/>
  <rect x="10" y="10" width="492" height="492" rx="106" stroke="url(#border512)" stroke-width="8" stroke-opacity="0.85"/>

  <!-- Ambient Center Glow -->
  <circle class="sc-glow" cx="256" cy="256" r="196" fill="url(#aura512)"/>

  <!-- Outer Cinema Reel Track & Rotating Arc -->
  <circle cx="256" cy="256" r="178" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="12"/>
  <circle class="sc-ring" cx="256" cy="256" r="178" stroke="url(#ring512)" stroke-width="16" stroke-linecap="round" stroke-dasharray="370 740"/>

  <!-- Inner Dark Lens Core -->
  <circle cx="256" cy="256" r="144" fill="#050914" stroke="url(#innerRing512)" stroke-width="6"/>

  <!-- Filmio Iconic "F + Play" Monogram (perfectly centered inside lens) -->
  <!-- Left Stem + Top Wing of "F" -->
  <path
    d="M178 184C178 171.85 187.85 162 200 162H316C328.15 162 338 171.85 338 184C338 196.15 328.15 206 316 206H224V336C224 348.703 213.703 359 201 359C188.297 359 178 348.703 178 336V184Z"
    fill="url(#fStem512)"
  />

  <!-- Glowing Play Prism forming the middle bar of "F" -->
  <path
    d="M246 238C246 228.5 256.6 222.8 264.6 227.9L338.6 274.9C345.9 279.5 345.9 290.5 338.6 295.1L264.6 342.1C256.6 347.2 246 341.5 246 332V238Z"
    fill="url(#play512)"
  />

  <defs>
    <linearGradient id="bg512" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#040711"/>
      <stop offset="0.5" stop-color="#091326"/>
      <stop offset="1" stop-color="#050A14"/>
    </linearGradient>
    <linearGradient id="border512" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="aura512" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) rotate(90) scale(196)">
      <stop stop-color="#0ea5e9" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring512" x1="84" y1="84" x2="428" y2="428" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="innerRing512" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="fStem512" x1="178" y1="162" x2="338" y2="359" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="play512" x1="246" y1="224" x2="346" y2="346" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.45" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
</svg>
